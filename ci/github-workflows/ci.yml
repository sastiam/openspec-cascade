name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bun:
    name: Bun 1.4 — typecheck, lint, audit, specs, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Configure git identity for fixture repositories
        run: |
          git config --global user.name "cascade-ci"
          git config --global user.email "cascade-ci@users.noreply.github.com"
          git config --global init.defaultBranch main
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Lint
        run: bunx eslint .
      - name: Forensic audit
        run: bun run scripts/forensic_audit.ts
      - name: Plugin hook rules in sync
        run: bun run scripts/sync_plugin.ts --check
      - name: OpenSpec strict validation
        run: bunx openspec validate --all --strict
      - name: Test suite (Bun)
        run: bun test

  node24:
    name: Node.js 24 LTS — parity suite and CLI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Configure git identity for fixture repositories
        run: |
          git config --global user.name "cascade-ci"
          git config --global user.email "cascade-ci@users.noreply.github.com"
          git config --global init.defaultBranch main
      - name: Node parity suite
        run: npm run test:node
      - name: CLI smoke test under Node
        run: node --import ./scripts/node_ts_register.mjs cascade.ts --help
